[package]
name = "ross-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
ross-common              = { path = "../ross-common" }
linked_list_allocator    = { version = "0.10", default-features = false, features = ["use_spin"] }
spin                     = "0.9.8"
lazy_static              = { version = "1.4.0", features = ["spin_no_std"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
